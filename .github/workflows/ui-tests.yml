name: UI Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run tests (${{ matrix.browser }}, headless, parallel)
        run: mvn -B clean test -Dbrowser=${{ matrix.browser }} -Dheadless=true

      - name: Build Allure report
        if: always()
        run: mvn -B allure:report

      - name: Upload reports, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.browser }}
          path: |
            target/surefire-reports/
            target/cucumber-report.html
            target/site/allure-maven-plugin/
            target/screenshots/
            target/logs/

  known-issues:
    # Tests for open defects. Expected to fail; a pass means a bug may be fixed and should be re-tested.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Run known-issue tests
        run: mvn -B clean test -DsuiteXmlFile=known-issues.xml -Dheadless=true
